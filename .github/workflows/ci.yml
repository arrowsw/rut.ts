name: CI

on:
  pull_request:
  push:
    branches: [canary]

# Cancel superseded runs on the same ref (e.g. quick successive pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repository, so every job gets a read-only token. This also
# limits what a third-party action (setup-deno, setup-bun) could do with it.
# Actions are pinned to full commit SHAs (tag in the comment), so a moved tag
# cannot change the code that runs here.
permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The library uses Web Crypto (`globalThis.crypto`) in generate(),
        # available since Node 19, with a Math.random fallback for older runtimes.
        # Test the active LTS lines (24 is LTS since Oct 2025).
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build (tsc ESM + CJS + terser)
        run: npm run build

      # Differential guard: 3.4.0 vs current validate() over a stratified
      # corpus. Fails if any non-documented behavior change is introduced.
      - name: Differential (behavior regression guard)
        run: npm run test:differential

  coverage:
    name: coverage (threshold guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Enforces the coverageThreshold in jest.config.cjs (measured against
      # src/**/*.ts, never the built dist). Fails the build on regressions.
      - name: Tests with coverage
        run: npm test -- --coverage

  size:
    name: size-limit (bundle guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Fails if the published bundle grows past the limits in .size-limit.json.
      - name: Check bundle size
        run: npm run size

  smoke-deno:
    name: smoke (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build
        run: npm ci

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8

      # Proves the README "runs in Deno" claim: load the real ESM build and
      # validate a RUT (and confirm the restricted shape is rejected).
      - name: Deno imports the ESM build and validates a RUT
        run: |
          deno eval "const m = await import('./dist/esm/index.min.js'); if (m.validate('12.345.678-5') !== true || m.validate('12.345.6785') !== false) { console.error('Deno smoke FAILED'); Deno.exit(1); } console.log('Deno smoke ok');"

  smoke-bun:
    name: smoke (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build
        run: npm ci

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Proves the README "runs in Bun" claim against the real ESM build.
      - name: Bun imports the ESM build and validates a RUT
        run: |
          bun -e "const m = await import('./dist/esm/index.min.js'); if (m.validate('12.345.678-5') !== true || m.validate('12.345.6785') !== false) { console.error('Bun smoke FAILED'); process.exit(1); } console.log('Bun smoke ok');"

  package:
    name: package (pack once, test the tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build
        run: npm ci

      # The same steps the publish workflow runs before it publishes, so they are
      # tested on every change and not only when a release tag is pushed.
      # --ignore-scripts keeps `npm pack` from running `prepare` (a second build).
      - name: Pack the build
        run: npm pack --ignore-scripts

      - name: Install the tarball in an empty project and test it
        run: node scripts/smoke-package.mjs rut.ts-*.tgz

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (flat config + prettier)
        run: npm run lint

      - name: Prettier (check only)
        run: npm run prettier:check
