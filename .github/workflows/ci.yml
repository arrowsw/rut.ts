name: CI

on:
  pull_request:
  push:
    branches: [canary]

# Cancel superseded runs on the same ref (e.g. quick successive pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Node LTS lines still in support (active or maintenance). This list
        # is the support policy: add a line when it becomes LTS, drop it when
        # it reaches end-of-life. Dropping an EOL line is not a breaking change,
        # and `engines.node` (>=22.12.0, the first 22.x that loads this ESM-only
        # package through require() without a flag) does not move with it.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build (tsc + terser)
        run: npm run build

      # Differential guard: 3.4.0 vs current validate() over a stratified
      # corpus. Fails if any non-documented behavior change is introduced.
      - name: Differential (behavior regression guard)
        run: npm run test:differential

  coverage:
    name: coverage (threshold guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Enforces the coverageThreshold in jest.config.cjs (measured against
      # src/**/*.ts, never the built dist). Fails the build on regressions.
      - name: Tests with coverage
        run: npm test -- --coverage

  size:
    name: size-limit (bundle guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Fails if the published bundle grows past the limits in .size-limit.json.
      - name: Check bundle size
        run: npm run size

  smoke-deno:
    name: smoke (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build
        run: npm ci

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Proves the README "runs in Deno" claim: load the real ESM build and
      # validate a RUT (and confirm the restricted shape is rejected).
      - name: Deno imports the ESM build and validates a RUT
        run: |
          deno eval "const m = await import('./dist/esm/index.min.js'); if (m.validate('12.345.678-5') !== true || m.validate('12.345.6785') !== false) { console.error('Deno smoke FAILED'); Deno.exit(1); } console.log('Deno smoke ok');"

  smoke-bun:
    name: smoke (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build
        run: npm ci

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Proves the README "runs in Bun" claim against the real ESM build.
      - name: Bun imports the ESM build and validates a RUT
        run: |
          bun -e "const m = await import('./dist/esm/index.min.js'); if (m.validate('12.345.678-5') !== true || m.validate('12.345.6785') !== false) { console.error('Bun smoke FAILED'); process.exit(1); } console.log('Bun smoke ok');"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (flat config + prettier)
        run: npm run lint

      # publint checks the package.json/exports wiring of the packed tarball.
      # attw checks the typings per resolution mode; `--profile esm-only`
      # skips the CommonJS-resolution rows (node10, node16 from CJS), whose
      # `CJSResolvesToESM` warning is expected for an ESM-only package.
      - name: Package lint (publint + attw)
        run: npm run lint:package
